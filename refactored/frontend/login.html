<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Unified Login - Aivendance</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" }, fontFamily: { "display": ["Space Grotesk", "sans-serif"] } } } }
    </script>
</head>
<body class="font-display antialiased bg-background-light dark:bg-background-dark text-slate-900 dark:text-white">
    <div class="relative flex min-h-screen w-full flex-col overflow-hidden lg:flex-row">
        <div class="relative hidden lg:flex lg:w-1/2 lg:flex-col bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1000&auto=format&fit=crop");'>
            <div class="absolute inset-0 bg-gradient-to-b from-primary/80 to-background-dark/95 mix-blend-multiply"></div>
            <div class="relative z-10 flex h-full flex-col justify-between p-16">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-bold tracking-tight text-white drop-shadow-md">Aivendance</span>
                </div>
                <div class="max-w-xl">
                    <h1 class="mb-6 text-5xl font-bold leading-tight tracking-tight text-white">Smart Attendance for <br/>Modern Universities.</h1>
                </div>
            </div>
        </div>

        <div class="flex flex-1 flex-col bg-background-light dark:bg-background-dark relative justify-center items-center px-6">
            <div class="w-full max-w-[440px] space-y-8">
                <div class="text-center lg:text-left">
                    <h2 class="text-3xl font-bold tracking-tight dark:text-white text-slate-900">Welcome Back</h2>
                    <p class="mt-2 text-base text-slate-500 dark:text-slate-400">Please select your role and sign in.</p>
                </div>

                <div class="flex w-full rounded-xl bg-slate-200 p-1.5 dark:bg-[#1c2127]">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="student" class="peer sr-only" checked>
                        <div class="flex items-center justify-center rounded-lg py-2.5 text-sm font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-primary dark:peer-checked:bg-[#283039] dark:peer-checked:text-white transition-all">Student</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="instructor" class="peer sr-only">
                        <div class="flex items-center justify-center rounded-lg py-2.5 text-sm font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-primary dark:peer-checked:bg-[#283039] dark:peer-checked:text-white transition-all">Instructor</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="admin" class="peer sr-only">
                        <div class="flex items-center justify-center rounded-lg py-2.5 text-sm font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-primary dark:peer-checked:bg-[#283039] dark:peer-checked:text-white transition-all">Admin</div>
                    </label>
                </div>

                <form class="space-y-5" onsubmit="event.preventDefault(); handleLogin();">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">ID / Username</label>
                        <input id="username" type="text" class="block w-full rounded-lg border-0 bg-white py-3.5 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-primary dark:bg-[#1c2127] dark:text-white dark:ring-slate-700" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                        <input id="password" type="password" class="block w-full rounded-lg border-0 bg-white py-3.5 px-4 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-primary dark:bg-[#1c2127] dark:text-white dark:ring-slate-700" required>
                    </div>
                    <button type="submit" id="login-btn" class="w-full rounded-lg bg-primary px-4 py-3.5 text-sm font-bold text-white shadow-lg hover:bg-blue-600 transition-all">Sign In</button>
                    <p id="error-msg" class="text-red-500 text-center text-sm hidden"></p>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const id = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');
            
            // Get selected role (for logic only, backend handles actual role check)
            const role = document.querySelector('input[name="role"]:checked').value;

            btn.innerText = "Verifying...";
            
            try {
                const formData = new FormData();
                formData.append('username', id);
                formData.append('password', pass);

                const res = await fetch('http://127.0.0.1:8000/auth/login', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);
                    
                    // Redirect logic
                    if (data.role === 'student') window.location.href = '/dashboard/student';
                    else if (data.role === 'instructor') window.location.href = '/dashboard/instructor';
                    else window.location.href = '/dashboard/admin';
                } else {
                    err.innerText = data.detail || "Login Failed";
                    err.classList.remove('hidden');
                    btn.innerText = "Sign In";
                }
            } catch (e) {
                err.innerText = "Server Error. Is Python running?";
                err.classList.remove('hidden');
                btn.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
