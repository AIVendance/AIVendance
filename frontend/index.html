<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVendance | Smart Classroom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #4f46e5; /* Indigo */
            --primary-glow: rgba(79, 70, 229, 0.4);
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --glass: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-dark));
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 2rem;
            position: relative;
            overflow-y: auto;
        }

        .panel {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CARDS & CONTAINERS --- */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            height: 85vh;
        }

        /* --- VIDEO MONITOR --- */
        .monitor-frame {
            background: black;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            height: 100%;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures we see the whole frame */
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* --- LIVE TAG --- */
        .status-pill {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: 0.3s;
        }
        .status-pill.live { color: var(--success); border-color: var(--success); }
        .pulse-dot {
            width: 8px; height: 8px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        .status-pill.live .pulse-dot { animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* --- ATTENDANCE LIST --- */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .student-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .student-row:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
        .student-row.Present { border-left-color: var(--success); }
        .student-row.Late { border-left-color: var(--warning); }
        .student-row.Wrong { border-left-color: var(--danger); }

        .time-badge {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        /* --- BUTTONS & INPUTS --- */
        input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4338ca; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- TOAST NOTIFICATION --- */
        .toast-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .toast {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px;
            transform: translateX(100%);
            animation: slideIn 0.3s forwards;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        
        @keyframes slideIn { to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

        /* --- ENROLLMENT GRID --- */
        .capture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .capture-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-eye"></i> AIVendance
        </div>
        
        <div class="nav-item active" onclick="switchTab('monitor', this)">
            <i class="fa-solid fa-desktop"></i> Live Monitor
        </div>
        <div class="nav-item" onclick="switchTab('admin', this)">
            <i class="fa-solid fa-sliders"></i> Class Controls
        </div>
        <div class="nav-item" onclick="switchTab('enroll', this)">
            <i class="fa-solid fa-user-plus"></i> Enroll Student
        </div>

        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <small style="color:var(--text-muted)">System Status</small>
            <div style="display:flex; align-items:center; gap:8px; margin-top:5px; color:var(--success); font-weight:600;">
                <div class="pulse-dot" style="background:var(--success)"></div> Online
            </div>
        </div>
    </nav>

    <main class="main-content">
        
        <section id="monitor" class="panel active">
            <div class="grid-layout">
                <div class="monitor-frame">
                    <video id="vid" autoplay muted></video>
                    <canvas id="cvs"></canvas>
                    <div class="status-pill" id="liveLabel">
                        <div class="pulse-dot"></div> <span id="classStatusText">OFFLINE</span>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="glass-panel" style="height: 200px;">
                        <canvas id="statsChart"></canvas>
                    </div>

                    <div class="glass-panel" style="flex: 1; display: flex; flex-direction: column;">
                        <div class="list-header">
                            <h3 style="margin:0">Real-time Log</h3>
                            <span id="countBadge" style="background:var(--primary); padding:4px 10px; border-radius:8px; font-size:0.8rem">0</span>
                        </div>
                        <div id="studentList" style="overflow-y: auto; flex: 1; padding-right: 5px;">
                            <div style="text-align:center; color:var(--text-muted); margin-top:50px;">
                                <i class="fa-solid fa-user-group" style="font-size:2rem; margin-bottom:10px;"></i><br>
                                Waiting for students...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="admin" class="panel">
            <h1 style="margin-bottom:20px">Classroom Management</h1>
            <div class="glass-panel" style="max-width: 600px;">
                <label style="color:var(--text-muted); display:block; margin-bottom:10px;">Session Configuration</label>
                <input type="text" id="clsInput" placeholder="Enter Class ID (e.g., CS101, ENG202)">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="manageClass('start')">
                        <i class="fa-solid fa-play"></i> Start Session
                    </button>
                    <button class="btn btn-danger" onclick="manageClass('stop')">
                        <i class="fa-solid fa-stop"></i> End Session
                    </button>
                </div>
                
                <div id="activeSessionInfo" style="margin-top: 20px; padding: 15px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; border: 1px solid var(--success); display: none;">
                    <i class="fa-solid fa-check-circle" style="color:var(--success)"></i> 
                    <strong>Active:</strong> <span id="activeClassName">None</span>
                </div>
            </div>
        </section>

        <section id="enroll" class="panel">
            <h1 style="margin-bottom:20px">New Student Registration</h1>
            <div class="grid-layout">
                <div class="glass-panel">
                    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                        <input type="text" id="eid" placeholder="Student ID">
                        <input type="text" id="ename" placeholder="Full Name">
                    </div>

                    <div style="background: black; border-radius: 12px; overflow: hidden; height: 350px; position: relative; margin: 1rem 0;">
                        <video id="evid" autoplay muted style="width:100%; height:100%; object-fit:cover;"></video>
                        <div style="position:absolute; bottom:15px; left:0; width:100%; text-align:center;">
                            <button class="btn btn-primary" style="width:auto; display:inline-flex; padding: 8px 20px;" onclick="snap()">
                                <i class="fa-solid fa-camera"></i> Capture
                            </button>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button class="btn" style="background: #334155; color: white;" onclick="startEnrollCam()">
                            <i class="fa-solid fa-power-off"></i> Enable Camera
                        </button>
                        <button class="btn btn-primary" id="submitBtn" onclick="submitEnrollment()" disabled>
                            <i class="fa-solid fa-upload"></i> Complete Registration
                        </button>
                    </div>
                </div>

                <div class="glass-panel">
                    <h3>Captured Images</h3>
                    <p style="color:var(--text-muted); font-size:0.9rem;">Need at least 3 photos (Max 10)</p>
                    <div class="capture-grid" id="captureGrid"></div>
                </div>
            </div>
        </section>

    </main>

    <div class="toast-container" id="toastArea"></div>

    <script>
        const API = "http://127.0.0.1:8000";
        let curClass = localStorage.getItem('activeClass') || "";
        let ws = null;
        let chart = null;
        let blobs = [];
        let studentsMap = new Map();

        // --- INIT ---
        window.onload = () => {
            initChart();
            if(curClass) {
                updateSessionUI(curClass);
                switchTab('monitor');
            }
        };

        // --- NAVIGATION ---
        function switchTab(id, btn) {
            // UI Toggle
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            if(btn) {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            // Logic Switch
            if(id === 'monitor') startMonitor(); else stopMonitor();
            if(id === 'enroll') startEnrollCam(); else stopEnrollCam();
        }

        // --- MONITOR LOGIC ---
        async function startMonitor() {
            if(!curClass) return;
            const v = document.getElementById('vid');
            
            try {
                v.srcObject = await navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}});
                if(ws) ws.close();
                ws = new WebSocket(`ws://127.0.0.1:8000/ws/classroom/${curClass}`);
                
                ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    if(d.type === "update") {
                        drawFaces(d.data);
                        updateTable(d.data);
                    }
                };

                if(!window.scanInt) window.scanInt = setInterval(sendFrame, 500); // 2 FPS for smoothness
                
                document.getElementById('classStatusText').innerText = `LIVE: ${curClass}`;
                document.querySelector('.status-pill').classList.add('live');

            } catch(e) { showToast("Camera Access Denied", "error"); }
        }

        function stopMonitor() {
            if(window.scanInt) clearInterval(window.scanInt);
            const v = document.getElementById('vid');
            if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
        }

        function sendFrame() {
            const v = document.getElementById('vid');
            if(!v.srcObject) return;
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v,0,0);
            c.toBlob(async b => {
                const fd = new FormData(); fd.append('image', b, 'f.jpg');
                if(curClass) await fetch(`${API}/recognize?classroom_id=${curClass}`, {method:'POST', body:fd});
            }, 'image/jpeg');
        }

        // --- VISUALIZATION ---
        function drawFaces(faces) {
            const v = document.getElementById('vid');
            const c = document.getElementById('cvs');
            
            if(v.videoWidth === 0) return;
            c.width = v.videoWidth; c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.clearRect(0,0,c.width, c.height);

            faces.forEach(f => {
                const [x, y, w, h] = f.box;
                const isKnown = f.student_id !== "Unknown";
                const color = isKnown ? '#10b981' : '#ef4444';

                // Fancy Corners
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                
                // Draw bracket corners only (Sci-fi style)
                const len = w * 0.2;
                ctx.beginPath();
                ctx.moveTo(x, y+len); ctx.lineTo(x, y); ctx.lineTo(x+len, y); // Top-Left
                ctx.moveTo(x+w-len, y); ctx.lineTo(x+w, y); ctx.lineTo(x+w, y+len); // Top-Right
                ctx.moveTo(x, y+h-len); ctx.lineTo(x, y+h); ctx.lineTo(x+len, y+h); // Bottom-Left
                ctx.moveTo(x+w-len, y+h); ctx.lineTo(x+w, y+h); ctx.lineTo(x+w, y+h-len); // Bottom-Right
                ctx.stroke();

                // Name Tag
                ctx.fillStyle = color;
                ctx.font = "bold 16px Inter";
                const txt = isKnown ? f.student_id : "UNKNOWN";
                const txtW = ctx.measureText(txt).width;
                ctx.fillRect(x, y-28, txtW + 20, 24);
                
                ctx.fillStyle = "white";
                ctx.fillText(txt, x+10, y-10);
            });
        }

        function updateTable(faces) {
            const list = document.getElementById('studentList');
            let hasUpdate = false;

            faces.forEach(f => {
                if(f.student_id !== "Unknown") {
                    studentsMap.set(f.student_id, f);
                    hasUpdate = true;
                }
            });

            if(!hasUpdate && studentsMap.size > 0) return; // Optimization

            list.innerHTML = "";
            let present=0, late=0, wrong=0;

            studentsMap.forEach(s => {
                let statusClass = "Present";
                if(s.status.includes("Late")) { statusClass = "Late"; late++; }
                else if(s.status.includes("WRONG")) { statusClass = "Wrong"; wrong++; }
                else present++;

                const div = document.createElement('div');
                div.className = `student-row ${statusClass}`;
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="background:#334155; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">
                            ${s.student_id.slice(-2)}
                        </div>
                        <div>
                            <div style="font-weight:600">${s.student_id}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted)">${s.status}</div>
                        </div>
                    </div>
                    <div style="text-align:right">
                        <div class="time-badge">${s.time}</div>
                        <div style="font-size:0.75rem; margin-top:4px;">⏱ ${s.duration}</div>
                    </div>
                `;
                list.appendChild(div);
            });

            // Update Stats
            document.getElementById('countBadge').innerText = studentsMap.size;
            chart.data.datasets[0].data = [present, late, wrong];
            chart.update();
        }

        // --- ADMIN ---
        async function manageClass(act) {
            const id = document.getElementById('clsInput').value;
            if(!id) return showToast("Please enter a Class ID", "error");

            try {
                const res = await fetch(`${API}/classroom/${id}/${act}`, {method:'POST'});
                if(res.ok) {
                    if(act === 'start') {
                        curClass = id;
                        localStorage.setItem('activeClass', id);
                        updateSessionUI(id);
                        showToast(`Class ${id} Started!`, "success");
                        // Auto switch
                        document.querySelector('.nav-item').click(); 
                    } else {
                        curClass = "";
                        localStorage.removeItem('activeClass');
                        updateSessionUI("");
                        showToast("Class Session Ended", "success");
                    }
                }
            } catch(e) { showToast("Connection Error", "error"); }
        }

        function updateSessionUI(id) {
            const info = document.getElementById('activeSessionInfo');
            if(id) {
                info.style.display = "block";
                document.getElementById('activeClassName').innerText = id;
            } else {
                info.style.display = "none";
            }
        }

        // --- ENROLLMENT ---
        async function startEnrollCam() {
            try {
                document.getElementById('evid').srcObject = await navigator.mediaDevices.getUserMedia({video:true});
                blobs = [];
                document.getElementById('captureGrid').innerHTML = "";
            } catch(e){}
        }
        function stopEnrollCam() {
            const v = document.getElementById('evid');
            if(v.srcObject) v.srcObject.getTracks().forEach(t=>t.stop());
        }
        function snap() {
            if(blobs.length >= 10) return showToast("Max 10 photos!", "error");
            const v = document.getElementById('evid');
            const c = document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
            c.getContext('2d').drawImage(v,0,0);
            c.toBlob(b => {
                blobs.push(b);
                const img = document.createElement('img');
                img.src = URL.createObjectURL(b);
                img.className = "capture-img";
                document.getElementById('captureGrid').appendChild(img);
                
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = `<i class="fa-solid fa-upload"></i> Complete Registration (${blobs.length}/10)`;
                if(blobs.length >= 3) btn.disabled = false;
            }, 'image/jpeg');
        }
        async function submitEnrollment() {
            const id = document.getElementById('eid').value;
            const name = document.getElementById('ename').value;
            if(!id || !name) return showToast("ID and Name required", "error");

            const fd = new FormData();
            fd.append('student_id', id);
            fd.append('full_name', name);
            blobs.forEach((b,i) => fd.append('files', b, `f${i}.jpg`));

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Uploading...";

            try {
                const r = await fetch(`${API}/enroll`, {method:'POST', body:fd});
                if(r.ok) {
                    showToast(`Student ${name} Enrolled Successfully`, "success");
                    blobs = [];
                    document.getElementById('captureGrid').innerHTML = "";
                    document.getElementById('eid').value = "";
                    document.getElementById('ename').value = "";
                    btn.innerText = "Complete Registration";
                } else {
                    showToast("Enrollment Failed", "error");
                    btn.disabled = false;
                }
            } catch(e) { showToast("Server Error", "error"); btn.disabled = false; }
        }

        // --- UTILS ---
        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.innerHTML = type === 'success' ? `<i class="fa-solid fa-check"></i> ${msg}` : `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            document.getElementById('toastArea').appendChild(t);
            setTimeout(() => { t.style.animation = "fadeOut 0.3s forwards"; setTimeout(()=>t.remove(), 300); }, 3000);
        }

        function initChart() {
            const ctx = document.getElementById('statsChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Present', 'Late', 'Wrong Class'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#94a3b8', font: {family:'Inter'} } },
                        title: { display: false }
                    },
                    cutout: '70%'
                }
            });
        }
    </script>
</body>
</html>
